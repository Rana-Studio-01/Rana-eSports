<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Payment</title>
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  <style>
    body { margin:0; background:#0A0A0F; color:#fff; font-family:sans-serif; padding:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; text-align:center; }
    .loader { border: 4px solid #1E1E24; border-top: 4px solid #FFC61A; border-radius: 50%; width: 44px; height: 44px; animation: spin 1s linear infinite; margin-bottom: 24px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader"></div>
  <div id="status" style="font-weight:bold; font-size:18px; margin-bottom:10px;">Loading Secure Checkout...</div>
  <div id="logs" style="color:#8A8A93; font-size:12px;">Connecting to Cashfree...</div>
  
  <script>
    // URL se session ID nikalne ka smart tarika
    const urlParams = new URLSearchParams(window.location.search);
    const session = urlParams.get('session');

    var logsEl = document.getElementById('logs');
    var statusEl = document.getElementById('status');

    if (!session) {
        statusEl.innerHTML = '<span style="color:#FF4D67;">Invalid Session</span>';
        logsEl.innerHTML = 'Payment session ID is missing.';
    } else {
        try {
          if (typeof Cashfree === 'undefined') {
            statusEl.innerHTML = '<span style="color:#FF4D67;">Error: SDK failed to load.</span>';
            logsEl.innerHTML = 'Please check your internet connection.';
          } else {
            // Production mode ON
            var cashfree = Cashfree({ mode: "production" });
            
            cashfree.checkout({
              paymentSessionId: session,
              redirectTarget: "_self"
            }).then(function(result) {
              if (result && result.error) {
                statusEl.innerHTML = '<span style="color:#FF4D67;">Payment Failed</span>';
                logsEl.innerHTML = '<span style="color:#FF4D67;">' + result.error.message + '</span>';
              }
            });
          }
        } catch (e) {
          statusEl.innerHTML = '<span style="color:#FF4D67;">System Error</span>';
          logsEl.innerHTML = '<span style="color:#FF4D67;">' + e.message + '</span>';
        }
    }
  </script>
</body>
</html>
