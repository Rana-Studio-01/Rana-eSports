<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Complete</title>
</head>
<body style="background:#0A0A0F; color:#fff; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; text-align:center; flex-direction:column; margin:0; padding:24px;">
  <h2 style="color:#22D67B; margin-bottom:12px;">Payment Completed! ✓</h2>
  <p id="status" style="color:#8A8A93; margin-bottom:24px;">Returning to app...</p>
  <a id="fallbackLink" href="#" style="display:none; background:#FFC61A; color:#050505; padding:14px 28px; border-radius:14px; text-decoration:none; font-weight:bold;">Tap to Return to App</a>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('order_id');
    const planId = urlParams.get('plan_id');

    if (orderId && planId) {
      const deepLink = 'ranaesports://payment-return?order_id=' + encodeURIComponent(orderId) + '&plan_id=' + encodeURIComponent(planId);
      const fallback = document.getElementById('fallbackLink');
      fallback.href = deepLink;

      // Auto-redirect turant try karo
      window.location.href = deepLink;

      // Agar 1.5 second mein app na khule, fallback button dikhao
      setTimeout(function() {
        document.getElementById('status').innerText = 'App automatically nahi khula? Neeche tap karo:';
        fallback.style.display = 'inline-block';
      }, 1500);
    } else {
      document.getElementById('status').innerText = 'Missing order details. Please return to the app manually.';
    }
  </script>
</body>
</html>
